
name: STACKORA - Construire la PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-pwa.yml"

permissions:
  contents: read

jobs:
  web-pwa:
    name: Build STACKORA Web
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code GitHub
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier TypeScript
        run: npm run typecheck -w mobile

      - name: Compiler STACKORA pour Netlify
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api--stackora--rc725y9s4fxd.code.run
          CI: "true"

      - name: Creer le ZIP pour Netlify
        uses: actions/upload-artifact@v4
        with:
          name: STACKORA-PWA-site-web
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 30
