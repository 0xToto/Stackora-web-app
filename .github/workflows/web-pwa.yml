
name: STACKORA - Construire la PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-pwa.yml"

permissions:
  contents: read

jobs:
  web-pwa:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier TypeScript
        run: npm run typecheck -w mobile

      - name: Compiler STACKORA avec Northflank
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api--stackora--rc725y9s4fxd.code.run

      - name: Generer les fichiers du site
        uses: actions/upload-artifact@v4
        with:
          name: STACKORA-PWA-site-web
          path: mobile/dist
          if-no-files-found: error
          retention-days: 7
